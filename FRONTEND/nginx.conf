server {
    listen 80;
    server_name _; # Звездочка или подчеркивание означает "принимать любой IP"

    # 1. Отдаем файлы фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Все запросы к API перекидываем в контейнер бэкенда
    location /api/ {
        proxy_pass http://backend:3001; # Имя "backend" возьмется из docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Разрешаем проброс кук
        proxy_set_header Cookie $http_cookie;
    }
}
